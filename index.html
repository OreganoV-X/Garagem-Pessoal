<!DOCTYPE html>
<html lang="pt-BR">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Garagem Pessoal</title>
<meta name="theme-color" content="#0b0c0f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;1,700;1,800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f5f7;--card:#fff;--txt:#1d1f23;--sub:#5f6672;--linha:#e3e6ea;
  --pri:#2563eb;--pri-txt:#fff;--pri-suave:#e8efff;
  --ok:#2f9e44;--ok-s:#e6f6ea;--at:#d9480f;--at-s:#fff1e6;--ve:#e03131;--ve-s:#fdecec;--info:#1c7ed6;--info-s:#e7f1fb;
  --raio:14px;--sombra:0 1px 3px rgba(0,0,0,.07);
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0f1115;--card:#1a1d23;--txt:#eceef2;--sub:#9aa2ae;--linha:#2b3038;--pri:#4c8dff;--pri-suave:#1b2a45;
    --ok-s:#16301d;--at:#ff922b;--at-s:#3a2a10;--ve:#ff6b6b;--ve-s:#3a1717;--info:#4dabf7;--info-s:#152a40;--sombra:none}
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
.topo{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--linha);padding:10px 16px;display:flex;align-items:center;gap:10px}
.topo .marca{font-weight:700;font-size:16px;flex:1}
.topo select{width:auto;max-width:55%;margin:0;padding:7px 10px}
main{max-width:640px;margin:0 auto;padding:14px 14px 100px}
nav.abas{position:fixed;bottom:0;left:0;right:0;z-index:5;background:var(--card);border-top:1px solid var(--linha);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.abas button{flex:1;background:none;border:0;padding:8px 2px 10px;color:var(--sub);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav.abas button.ativa{color:var(--pri);font-weight:700}
.card{background:var(--card);border-radius:var(--raio);padding:14px;margin-bottom:12px;box-shadow:var(--sombra);border:1px solid var(--linha)}
h2{font-size:17px;margin:20px 2px 10px}
h3{font-size:16px;margin:0 0 8px}
.sub{color:var(--sub);font-size:13px}
.btn{appearance:none;border:1px solid var(--linha);background:var(--card);color:var(--txt);border-radius:10px;padding:10px 14px;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--pri-txt)}
.btn.perigo{color:var(--ve);border-color:var(--ve)}
.btn.grande{width:100%;padding:15px;font-size:17px;border-radius:12px}
.btn.peq{padding:7px 11px;font-size:13px}
.btn:disabled{opacity:.6}
.linha-btns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.semfoto{width:96px;height:96px;border-radius:12px;object-fit:cover;background:var(--pri-suave);flex:none;display:flex;align-items:center;justify-content:center;color:var(--pri)}
.kmbox{display:flex;gap:10px;margin:14px 0 6px}
.kmbox>div{flex:1;background:var(--bg);border-radius:12px;padding:10px 12px}
.rot{font-size:12px;color:var(--sub)}
.num-g{font-size:24px;font-weight:700}
.num-m{font-size:17px;font-weight:700}
.mcard{border-left:5px solid var(--linha)}
.mcard.vencido{border-left-color:var(--ve)}.mcard.atencao{border-left-color:var(--at)}.mcard.ok{border-left-color:var(--ok)}
.mtopo{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.mnome{font-weight:700;font-size:16px}
.selo{font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;white-space:nowrap}
.selo.vencido{background:var(--ve-s);color:var(--ve)}.selo.atencao{background:var(--at-s);color:var(--at)}.selo.ok{background:var(--ok-s);color:var(--ok)}.selo.sem,.selo.info{background:var(--info-s);color:var(--info)}
.destaque{font-size:15px;font-weight:600;margin:6px 0 2px}
.barra{height:6px;background:var(--linha);border-radius:4px;overflow:hidden;margin:8px 0}
.barra>i{display:block;height:100%;border-radius:4px;background:var(--info)}
.mcard.ok .barra>i{background:var(--ok)}.mcard.atencao .barra>i{background:var(--at)}.mcard.vencido .barra>i{background:var(--ve)}
.acoes{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.lista .it{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--linha)}
.lista .it:first-child{padding-top:0}
.lista .it:last-child{border-bottom:0;padding-bottom:0}
.lista .it .c{flex:1;min-width:0}
.lista .it .t{font-weight:600}
.ponto{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none;background:var(--info)}
.ponto.vencido{background:var(--ve)}.ponto.atencao{background:var(--at)}
.seg{display:flex;background:var(--card);border:1px solid var(--linha);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:9px 4px;border-radius:9px;font-weight:600;color:var(--sub);font-size:14px}
.seg button.ativa{background:var(--pri-suave);color:var(--pri)}
.vazio{text-align:center;padding:26px 16px}
.vazio .semfoto{margin:0 auto 6px}
.menu{padding:4px 14px}
.menu button{display:flex;width:100%;align-items:center;justify-content:space-between;background:none;border:0;border-bottom:1px solid var(--linha);padding:15px 2px;font-size:16px;color:var(--txt);text-align:left}
.menu button:last-child{border-bottom:0}
a{color:var(--pri)}
.grade2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grade2>div{background:var(--bg);border-radius:10px;padding:8px 10px;min-width:0}
.ficha{margin:0}
.ficha dt{font-size:12px;color:var(--sub)}.ficha dd{margin:0;font-weight:600;word-wrap:break-word}
/* folha (formulário) */
.fundo{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.folha{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom))}
.folha-topo{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.folha-topo h3{margin:0}
.x{border:0;background:none;font-size:30px;line-height:1;color:var(--sub);padding:0 4px;cursor:pointer}
label.campo{display:block;margin:12px 0 0;font-size:13px;font-weight:600;color:var(--sub)}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--txt);background:var(--bg);border:1px solid var(--linha);border-radius:10px;padding:11px 12px;margin-top:4px}
input[type=file]{font-size:14px;padding:9px}
textarea{min-height:76px;resize:vertical}
input[type=checkbox]{width:22px;height:22px;margin:0;flex:none;accent-color:var(--pri)}
.chk{display:flex;gap:10px;align-items:center;margin:12px 0 4px;font-size:15px}
.ajuda{font-size:12px;color:var(--sub);margin-top:4px}
.form-acoes{display:flex;gap:8px;margin-top:18px}
.form-acoes .btn{flex:1}
.rev-item{border:1px solid var(--linha);border-radius:10px;padding:10px;margin:8px 0}
.rev-item .grade2>div{background:none;padding:0}
.rev-item label.campo{margin-top:2px}
.oculto{display:none!important}
.carregando{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;gap:14px;padding:24px;text-align:center;font-weight:600}
.spin{width:42px;height:42px;border:4px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:gira .9s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:#222;color:#fff;padding:11px 16px;border-radius:10px;z-index:50;width:max-content;max-width:90%;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#toast.erro{background:#b42318}
.chat{display:flex;flex-direction:column;gap:8px}
.msg{padding:10px 12px;border-radius:14px;max-width:88%;word-wrap:break-word}
.msg.user{align-self:flex-end;background:var(--pri);color:#fff;border-bottom-right-radius:4px}
.msg.assistant{align-self:flex-start;background:var(--card);border:1px solid var(--linha);border-bottom-left-radius:4px}
.barras .b{display:flex;align-items:center;gap:8px;font-size:13px;margin:5px 0}
.barras .b .m{width:30px;color:var(--sub)}
.barras .b .trilho{flex:1;background:var(--bg);border-radius:4px;height:14px;overflow:hidden}
.barras .b .trilho i{display:block;height:100%;background:var(--pri);border-radius:4px}
.barras .b .v{width:96px;text-align:right}

/* ===== identidade ===== */
.topo .marca{display:flex;align-items:center;gap:9px}
.topo .logo{width:28px;height:28px;flex:none}
.btn.branco{background:#fff;color:#0b2a5b;border-color:#fff}
.btn.link-claro{background:none;border:0;color:#cfe3ff;margin-top:6px;width:100%}
.btn svg{vertical-align:-3px}
.sub.obs{margin-top:4px}
/* abertura */
.abertura{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  background:var(--fundo-abertura);color:#fff;transition:opacity .45s ease}
.abertura.saindo{opacity:0}
.partida{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:18px;animation:sobe .4s both}
.partida.oculto{display:none}
.abertura.esperando .abertura-barra{display:none}
.btn-partida{display:flex;align-items:center;gap:10px;padding:14px 30px;border:0;border-radius:40px;background:var(--destaque);color:#fff;
  font:700 18px var(--fonte-tit);letter-spacing:.5px;box-shadow:0 0 0 0 var(--destaque);animation:pulsa 1.6s infinite;cursor:pointer}
.tema-esportivo .btn-partida{border-radius:6px;font-style:italic;text-transform:uppercase}
.tema-custom .btn-partida{color:#2b1a0d}
.sem-som{background:none;border:0;color:rgba(255,255,255,.7);font-size:14px;text-decoration:underline;cursor:pointer}
@keyframes pulsa{0%{box-shadow:0 0 0 0 rgba(255,255,255,.35)}70%{box-shadow:0 0 0 18px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
.cores{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:8px 0 4px}
.cor{width:36px;height:36px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1px var(--linha);cursor:pointer;padding:0}
.cor.escolhida{box-shadow:0 0 0 3px var(--txt)}
.cor-livre{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub)}
.cor-livre input{width:40px;height:36px;border:1px solid var(--linha);border-radius:8px;padding:2px;background:var(--card)}
.chave{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0}
.chave input{width:22px;height:22px;accent-color:var(--pri)}
.col-btns{display:flex;flex-direction:column;gap:6px}
.btn.perigo{color:var(--ve);border-color:var(--ve)}
.menu button.sair span:first-child{color:var(--ve);font-weight:700}
.abertura.desligada .agulha{animation:desliga 1.2s ease-in forwards!important}
.abertura.desligada .rastro{display:none}
@keyframes desliga{from{transform:rotate(-100deg)}to{transform:rotate(-135deg)}}
.religar{display:none;flex-direction:column;align-items:center;gap:12px;margin-top:18px}
.abertura.desligada .religar{display:flex}
.abertura.desligada .abertura-barra,.abertura.desligada .partida{display:none}
.conectar{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:18px}
.conectar-caixa{width:100%;max-width:420px}
.conectar-caixa .campo{display:block;margin:12px 0}
.conectar-caixa .campo span{display:block;font-size:13px;color:var(--sub);margin-bottom:4px}
.conectar-caixa input{width:100%;box-sizing:border-box;padding:12px;border:1px solid var(--linha);border-radius:10px;background:var(--bg);color:var(--txt);font-size:15px}
.conectar-erro{color:var(--ve);font-weight:600}
.conectar{overflow:auto;align-items:flex-start;padding-top:max(18px,6vh)}
.login-logo{display:flex;align-items:center;gap:10px;font:700 22px var(--fonte-tit);margin-bottom:12px;color:var(--txt)}
.login-logo svg{color:var(--pri)}
.login-seg{display:flex;gap:6px;margin-bottom:6px}
.login-seg button{flex:1;padding:10px;border:1px solid var(--linha);background:var(--card);color:var(--txt);border-radius:10px;font-weight:700}
.login-seg button.ativo{background:var(--pri);border-color:var(--pri);color:var(--pri-txt)}
.link-servidor{background:none;border:0;color:var(--sub);text-decoration:underline;font-size:13px;margin-top:14px;padding:0}
.som-linha{border-top:1px solid var(--linha);padding-top:10px;margin-top:10px}
.som-linha .acoes{margin-top:6px}
.abertura-logo .logo{width:92px;height:92px;filter:drop-shadow(0 10px 30px rgba(0,0,0,.35));animation:surge .7s cubic-bezier(.2,.9,.3,1.3) both}
.abertura-nome{font-size:26px;font-weight:800;letter-spacing:.3px;animation:sobe .6s .15s both}
.abertura-sub{font-size:14px;color:#bcd4ff;animation:sobe .6s .25s both}
.abertura-barra{width:120px;height:4px;border-radius:4px;background:rgba(255,255,255,.18);overflow:hidden;margin-top:22px}
.abertura-barra i{display:block;width:40%;height:100%;background:var(--destaque);border-radius:4px;animation:corre 1.1s ease-in-out infinite}
@keyframes surge{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes sobe{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
@keyframes corre{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
/* introdução */
.intro{position:fixed;inset:0;z-index:55;display:flex;flex-direction:column;color:#fff;padding:18px 22px calc(26px + env(safe-area-inset-bottom));
  background:var(--fundo-abertura)}
.intro-pular{align-self:flex-end;background:none;border:0;color:#bcd4ff;font-size:15px;font-weight:600;padding:6px;min-height:32px}
.intro-corpo{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;max-width:420px;margin:0 auto;animation:sobe .45s both}
.intro-corpo .ilus{width:240px;height:200px;margin-bottom:10px}
.intro h1{font-size:26px;line-height:1.2;margin:6px 0 10px}
.intro p{font-size:16px;line-height:1.5;color:#d6e4ff;margin:0}
.intro-pontos{display:flex;gap:8px;justify-content:center;margin:18px 0}
.intro-pontos i{width:8px;height:8px;border-radius:8px;background:rgba(255,255,255,.3);transition:width .2s}
.intro-pontos i.ativo{width:24px;background:#fff}
.intro-botoes{max-width:420px;width:100%;margin:0 auto}
/* início */
.hero{position:relative;overflow:hidden;border-radius:20px;padding:18px 18px 16px;margin-bottom:14px;color:#fff;
  background:var(--hero-bg);background-size:cover;background-position:center;box-shadow:var(--hero-sombra-caixa)}
.hero.com-foto{padding-top:120px}
.hero-marca{position:absolute;right:-14px;top:-10px;color:rgba(255,255,255,.12)}
.hero-topo{position:relative}
.hero-apelido{font-size:22px;font-weight:800}
.hero-sub{font-size:13px;color:#cfe0ff}
.hero-km{position:relative;font-size:16px;color:#cfe0ff;margin-top:14px}
.hero-km span{font-size:44px;font-weight:800;color:#fff;letter-spacing:-1px;line-height:1}
.hero-meta{position:relative;font-size:13px;color:#cfe0ff;margin:4px 0 14px}
.atalhos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:6px}
.atalhos button{background:var(--card);border:1px solid var(--linha);border-radius:14px;padding:12px 4px 10px;display:flex;flex-direction:column;
  align-items:center;gap:6px;color:var(--pri);font-size:11.5px;font-weight:600;cursor:pointer}
.atalhos button span{color:var(--txt);text-align:center;line-height:1.2}
/* dúvidas */
.busca-caixa{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--linha);border-radius:14px;padding:4px 12px;color:var(--sub);margin-bottom:10px;box-shadow:var(--sombra)}
.busca-caixa input{border:0;background:none;margin:0;padding:12px 0;font-size:16px}
.busca-caixa input:focus{outline:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--linha);background:var(--card);color:var(--txt);border-radius:20px;padding:7px 12px;font-size:13px;font-weight:600}
.topico{padding:0}
.topico-titulo{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;background:none;border:0;padding:14px;font-size:15px;font-weight:700;color:var(--txt);text-align:left;cursor:pointer}
.topico-titulo .seta{color:var(--pri);font-size:20px;font-weight:400}
.topico.aberto{border-color:var(--pri)}
.topico .resposta{margin:0;padding:0 14px 0 32px}
.topico .resposta li{margin:0 0 8px;line-height:1.5}
.topico .fonte,.topico .acoes,.topico .sua-moto{margin-left:14px;margin-right:14px}
.topico .acoes{padding-bottom:14px}
.fonte{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub);margin-top:4px}
.sua-moto{background:var(--bg);border-radius:10px;padding:9px 10px;margin-bottom:10px;font-size:14px;line-height:1.5}
.sua-moto .selo{margin-left:4px}
.claude-card{display:flex;flex-direction:column;gap:10px}
.arquivos .slot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 0;border-top:1px solid var(--linha)}
.slot-nome{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--txt)}
.slot-nome svg{color:var(--pri);flex:none}
.slot-acoes{display:flex;gap:6px;flex:none}
label.btn{cursor:pointer}
.btn.grande svg{vertical-align:-4px}
.aviso-r15{border-color:var(--pri);background:var(--pri-suave)}
.passo{margin:14px 0 8px;font-size:14px;line-height:1.5}
#respostaClaude{min-height:120px;font-size:13px}

/* ===================== TEMAS ===================== */
:root{--fonte-tit:inherit;--destaque:#ff3b30;--hero-sombra:rgba(0,0,0,.85);--hero-sombra-caixa:0 10px 30px rgba(0,0,0,.25);
  --fundo-abertura:radial-gradient(120% 80% at 50% 0%,#2563eb 0%,#0b2a5b 55%,#06142e 100%);--hero-bg:linear-gradient(150deg,#2563eb 0%,#0b2a5b 70%)}
h1,h2,h3,.hero-apelido,.mnome,.hero-km span,.abertura-nome,.topo .marca span,.num-g,.fin-grande,.amostra-nome{font-family:var(--fonte-tit)}

/* Esportivo: carbono, vermelho de corrida, letras condensadas e inclinadas */
.tema-esportivo{--bg:#0b0c0f;--card:#15171c;--txt:#f2f3f5;--sub:#9aa0aa;--linha:#272b33;--pri:#e10600;--pri-txt:#fff;--pri-suave:#2b1212;
  --ok:#2fd16b;--ok-s:#10261a;--at:#ff8a1f;--at-s:#2e1d0c;--ve:#ff4d4d;--ve-s:#311212;--info:#4cc3ff;--info-s:#0f2230;--raio:6px;--sombra:none;
  --fonte-tit:'Barlow Condensed','Arial Narrow',sans-serif;--destaque:#ff2a1f;
  --fundo-abertura:radial-gradient(120% 75% at 50% 0%,#4a0b08 0%,#140808 50%,#050506 100%);
  --hero-bg:linear-gradient(115deg,transparent 62%,var(--pri) 62.2%,var(--pri) 66%,transparent 66.2%),repeating-linear-gradient(45deg,#16181d 0 6px,#1d2026 6px 12px);
  --hero-sombra:rgba(5,5,7,.92);--hero-sombra-caixa:0 10px 30px rgba(0,0,0,.6)}
.tema-esportivo h2,.tema-esportivo .hero-apelido,.tema-esportivo .mnome,.tema-esportivo .abertura-nome,.tema-esportivo .fin-grande{font-style:italic;text-transform:uppercase;letter-spacing:.5px}
.tema-esportivo h2{font-size:20px;border-left:4px solid var(--pri);padding-left:8px}

/* velocímetro da abertura: a agulha sobe e cai como numa arrancada trocando marcha */
.velocimetro{width:190px;height:190px;filter:drop-shadow(0 12px 30px rgba(0,0,0,.45));animation:surge .6s cubic-bezier(.2,.9,.3,1.3) both}
.velocimetro text{font-family:var(--fonte-tit)}
.velocimetro .agulha{transform-box:view-box;transform-origin:100px 104px;transform:rotate(-135deg);animation:arranque 2.6s infinite}
.velocimetro .rastro line{animation:vento .5s linear infinite}
.velocimetro .rastro line:nth-child(2){animation-delay:.15s}.velocimetro .rastro line:nth-child(3){animation-delay:.3s}
@keyframes arranque{
  0%{transform:rotate(-135deg);animation-timing-function:cubic-bezier(.55,0,.9,.55)}
  24%{transform:rotate(45deg);animation-timing-function:cubic-bezier(.2,.8,.4,1)}
  30%{transform:rotate(-25deg);animation-timing-function:cubic-bezier(.55,0,.9,.55)}
  52%{transform:rotate(80deg);animation-timing-function:cubic-bezier(.2,.8,.4,1)}
  58%{transform:rotate(15deg);animation-timing-function:cubic-bezier(.55,0,.9,.55)}
  82%{transform:rotate(112deg)}
  88%{transform:rotate(104deg)}
  92%{transform:rotate(112deg);animation-timing-function:ease-in}
  100%{transform:rotate(-135deg)}}
@keyframes vento{0%{transform:translateX(18px);opacity:0}30%{opacity:.8}100%{transform:translateX(-22px);opacity:0}}
.tema-custom .velocimetro .agulha{animation-name:ronco;animation-duration:3s}
.tema-custom .velocimetro .rastro{display:none}
.abertura.tocando .velocimetro .agulha{animation-iteration-count:1}
.tema-esportivo .abertura.tocando .velocimetro .agulha{animation-duration:3.1s}
@keyframes ronco{
  0%{transform:rotate(-135deg)}
  14%{transform:rotate(-135deg);animation-timing-function:cubic-bezier(.2,.8,.4,1)}
  20%{transform:rotate(-80deg)}26%{transform:rotate(-104deg)}32%{transform:rotate(-96deg)}38%{transform:rotate(-102deg)}
  44%{transform:rotate(-97deg)}50%{transform:rotate(-101deg);animation-timing-function:cubic-bezier(.3,0,.6,1)}
  60%{transform:rotate(-10deg);animation-timing-function:cubic-bezier(.4,0,.7,1)}
  72%{transform:rotate(-99deg)}78%{transform:rotate(-95deg)}84%{transform:rotate(-101deg)}
  90%{transform:rotate(-97deg);animation-timing-function:ease-in}
  100%{transform:rotate(-135deg)}}
@media (prefers-reduced-motion: reduce){.velocimetro .agulha,.velocimetro .rastro line{animation:none}}

<script>
function gpHex(h){h=String(h||'').replace('#','');if(h.length===3)h=h.split('').map(function(c){return c+c}).join('');return /^[0-9a-f]{6}$/i.test(h)?[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]:null}
function gpMix(a,b,t){var x=gpHex(a),y=gpHex(b);return '#'+[0,1,2].map(function(i){return ('0'+Math.round(x[i]*(1-t)+y[i]*t).toString(16)).slice(-2)}).join('')}
function gpLuz(h){var c=gpHex(h);return (0.299*c[0]+0.587*c[1]+0.114*c[2])/255}
/* Aplica as cores que o usuário escolheu (ou volta às cores do estilo). */
function aplicarCoresSalvas(){
  var r=document.documentElement,s=r.style,L=function(k){try{return localStorage.getItem('gp_'+k)||''}catch(e){return ''}};
  var custom=r.classList.contains('tema-custom'),app=L('cor_app'),ab=L('cor_abertura');
  ['--pri','--destaque','--pri-suave','--pri-txt','--hero-bg','--fundo-abertura'].forEach(function(v){s.removeProperty(v)});
  if(gpHex(app)){
    s.setProperty('--pri',app);
    s.setProperty('--destaque',custom?gpMix(app,'#ffffff',.35):app);
    s.setProperty('--pri-suave',custom?gpMix(app,'#ffffff',.85):gpMix(app,'#0b0c0f',.82));
    s.setProperty('--pri-txt',gpLuz(app)>.62?'#111111':'#ffffff');
    if(custom)s.setProperty('--hero-bg','linear-gradient(160deg,'+gpMix(app,'#000000',.3)+' 0%,'+gpMix(app,'#000000',.68)+' 100%)');
  }
  if(gpHex(ab))s.setProperty('--fundo-abertura','radial-gradient(120% 75% at 50% 0%,'+ab+' 0%,'+gpMix(ab,'#000000',.7)+' 55%,#050506 100%)');
}
try{document.documentElement.className="tema-"+(localStorage.getItem("gp_tema")==="custom"?"custom":"esportivo")}catch(e){document.documentElement.className="tema-esportivo"}
aplicarCoresSalvas();
</script>

<script>
// ===================== CONEXÃO COM O SERVIDOR =====================
// Dentro do Apps Script existe google.script.run. No GitHub, a tela conversa com o endereço /exec usando a senha.
const NA_NUVEM = !(window.google && google.script && google.script.run);
function apiCfg() { return { url: lerLocal('api_url'), token: lerLocal('token') }; }
function chamarApi(fn, args, semToken) {
  const c = apiCfg();
  if (!c.url) return Promise.reject(new Error('SEM_SERVIDOR'));
  if (!semToken && !c.token) return Promise.reject(new Error('SESSAO_EXPIRADA'));
  return fetch(c.url, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ token: semToken ? '' : c.token, fn, args }) })
    .then(r => { if (!r.ok) throw new Error('O servidor respondeu com erro ' + r.status + '.'); return r.json(); },
      () => { throw new Error('Sem conexão com o servidor. Confira a internet e o endereço do servidor.'); })
    .then(j => {
      if (j.ok) return j.r;
      if (/SESSAO_EXPIRADA/.test(j.erro)) { gravarLocal('token', ''); telaLogin('entrar', 'Sua sessão terminou. Entre de novo.'); }
      throw new Error(j.erro);
    });
}
if (NA_NUVEM) {
  const fazer = (ok, ruim) => new Proxy({}, {
    get: (_, nome) => {
      if (nome === 'withSuccessHandler') return f => fazer(f, ruim);
      if (nome === 'withFailureHandler') return f => fazer(ok, f);
      return (...args) => { chamarApi(nome, args).then(r => ok && ok(r), e => ruim && ruim(e)); };
    }
  });
  window.google = window.google || {};
  google.script = { run: fazer(null, null) };
}
// ===================== LOGIN E CADASTRO =====================
function mascaraCpf(v) {
  const d = String(v || '').replace(/\D/g, '').slice(0, 11);
  if (d.length <= 3) return d;
  if (d.length <= 6) return d.slice(0, 3) + '.' + d.slice(3);
  if (d.length <= 9) return d.slice(0, 3) + '.' + d.slice(3, 6) + '.' + d.slice(6);
  return d.slice(0, 3) + '.' + d.slice(3, 6) + '.' + d.slice(6, 9) + '-' + d.slice(9);
}
function cpfOk(c) {
  c = String(c || '').replace(/\D/g, '');
  if (c.length !== 11 || /^(\d)\1+$/.test(c)) return false;
  for (let t = 9; t < 11; t++) {
    let soma = 0;
    for (let i = 0; i < t; i++) soma += Number(c[i]) * (t + 1 - i);
    if (((soma * 10) % 11) % 10 !== Number(c[t])) return false;
  }
  return true;
}
const LOGIN = { aba: 'entrar', servidor: false };
function telaLogin(aba, msg) {
  if (aba) LOGIN.aba = aba;
  let el = document.getElementById('conectar');
  if (!el) { el = document.createElement('div'); el.id = 'conectar'; el.className = 'conectar'; document.body.appendChild(el); }
  const url = lerLocal('api_url'), mostrarServ = !url || LOGIN.servidor;
  const campo = (id, rot, extra) => '<label class="campo"><span>' + rot + '</span><input id="' + id + '" ' + extra + '></label>';
  const senha = (id, rot) => campo(id, rot, 'type="password" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="2 a 6 números"');
  el.innerHTML = '<div class="card conectar-caixa">' +
    '<div class="login-logo">' + icone('moto', 34) + '<b>Garagem Pessoal</b></div>' +
    '<div class="login-seg"><button class="' + (LOGIN.aba === 'entrar' ? 'ativo' : '') + '" data-acao="loginAba" data-k="entrar">Entrar</button>' +
    '<button class="' + (LOGIN.aba === 'cadastrar' ? 'ativo' : '') + '" data-acao="loginAba" data-k="cadastrar">Cadastrar</button></div>' +
    (msg ? '<p class="conectar-erro">' + esc(msg) + '</p>' : '') +
    (LOGIN.aba === 'entrar'
      ? campo('lgCpf', 'CPF', 'type="text" inputmode="numeric" autocomplete="username" placeholder="000.000.000-00" data-cpf') + senha('lgSenha', 'Senha') +
        '<button class="btn pri grande" data-acao="entrar">Entrar</button>'
      : campo('cdNome', 'Seu nome', 'type="text" autocomplete="name"') +
        campo('cdCpf', 'CPF', 'type="text" inputmode="numeric" placeholder="000.000.000-00" data-cpf') +
        campo('cdEmail', 'E-mail (para receber os avisos, opcional)', 'type="email" autocomplete="email"') +
        senha('cdSenha', 'Crie uma senha') + senha('cdSenha2', 'Repita a senha') +
        campo('cdCodigo', 'Código de cadastro', 'type="text" autocapitalize="characters" autocomplete="off" placeholder="XXXX-XXXX-XXXX"') +
        '<p class="sub">O código de cadastro é criado pela função <b>criarSenha</b> no Apps Script. O primeiro cadastro fica com os dados que já estão no app.</p>' +
        '<button class="btn pri grande" data-acao="cadastrar">Criar meu cadastro</button>') +
    (mostrarServ
      ? campo('cxUrl', 'Endereço do servidor (Apps Script, termina em /exec)', 'type="url" placeholder="https://script.google.com/macros/s/.../exec" value="' + esc(url) + '"')
      : '<button class="link-servidor" data-acao="loginServidor">Trocar o endereço do servidor</button>') +
    '</div>';
}
function lerServidorLogin() {
  const campo = document.getElementById('cxUrl');
  if (!campo) return true;
  const url = campo.value.trim();
  if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(url)) { telaLogin(null, 'O endereço do servidor precisa começar com https://script.google.com e terminar em /exec.'); return false; }
  gravarLocal('api_url', url);
  return true;
}
/** Volta para a tela de abertura com o login por cima (depois de sair da conta). */
function mostrarAberturaLogin() {
  S.d = null; S.aba = 'inicio'; S.subMais = ''; S.fotos = {};
  AB.dados = null; AB.liberada = !somLigado();
  const sp = $('#abertura');
  sp.classList.remove('oculto', 'saindo', 'tocando', 'desligada');
  if (somLigado()) { sp.classList.add('esperando'); $('#partida').classList.remove('oculto'); $('.abertura-sub').textContent = 'pronta para a partida'; }
  $('#tela').innerHTML = '';
  telaLogin('entrar');
}
function preencher(vals) { Object.keys(vals).forEach(k => { const el = document.getElementById(k); if (el && vals[k]) el.value = vals[k]; }); }
async function fazerLogin(fn, dados, manter) {
  carregando(fn === 'entrar' ? 'Entrando...' : 'Criando o cadastro...');
  try {
    const r = await chamarApi(fn, [dados], true);
    gravarLocal('token', r.token); gravarLocal('usuario', r.nome);
    pronto();
    const el = document.getElementById('conectar'); if (el) el.remove();
    AB.sons = carregarSons().catch(() => { });
    carregar();
  } catch (e) {
    pronto();
    telaLogin(null, msgErro(e));
    preencher(manter);
  }
}

// ===================== ESTADO =====================

const $ = s => document.querySelector(s);
function lerLocal(k) { try { return localStorage.getItem('gp_' + k) || ''; } catch (e) { return ''; } }
function gravarLocal(k, v) { try { localStorage.setItem('gp_' + k, v); } catch (e) { } }
function esc(s) { return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function dia(iso) { const m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? Math.round(Date.UTC(+m[1], m[2] - 1, +m[3]) / 864e5) : null; }
function fData(iso) { const m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? m[3] + '/' + m[2] + '/' + m[1] : ''; }
function fNum(n, dec) { return n === null || n === undefined || n === '' ? '' : Number(n).toLocaleString('pt-BR', { maximumFractionDigits: dec === undefined ? 1 : dec }); }
function fKm(n) { return n === null || n === undefined || n === '' ? '' : fNum(Math.round(n), 0) + ' km'; }
function fR(n) { return Number(n || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }
function diasAte(iso) { const a = dia(iso); return a === null ? null : a - dia(S.d.hoje); }
function rel(iso) {
  const d = diasAte(iso);
  if (d === null) return '';
  if (d === 0) return 'hoje';
  if (d === 1) return 'amanhã';
  if (d === -1) return 'ontem';
  return d > 0 ? 'em ' + d + ' dias' : 'há ' + (-d) + ' dias';
}
function fMeses(m) {
  if (!m) return '';
  if (m < 1) return Math.round(m * 30) + ' dias';
  if (m % 12 === 0) return m === 12 ? '1 ano' : (m / 12) + ' anos';
  return m === 1 ? '1 mês' : fNum(m) + ' meses';
}
function intervalo(c) { return [c.intervaloKm ? 'a cada ' + fKm(c.intervaloKm) : '', c.intervaloMeses ? fMeses(c.intervaloMeses) : ''].filter(Boolean).join(' ou '); }
function numero(s) {
  s = String(s === null || s === undefined ? '' : s).trim().replace(/\s|R\$/g, '');
  if (!s) return null;
  if (s.indexOf(',') >= 0) s = s.replace(/\./g, '').replace(',', '.');
  else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  const n = Number(s);
  return isNaN(n) ? NaN : n;
}

/** Quem não é o dono do Drive abre os arquivos pelo servidor. */
async function abrirArqServidor(id) {
  const janela = window.open('', '_blank');
  carregando('Abrindo o arquivo...');
  try {
    const r = await run('lerArquivo', id);
    const url = URL.createObjectURL(new Blob([new Uint8Array(base64ParaBuffer(r.base64))], { type: r.tipo || 'application/pdf' }));
    if (janela) janela.location = url; else location.href = url;
  } catch (e) { if (janela) janela.close(); toast(msgErro(e), true); }
  finally { pronto(); }
}

  if (v.perfil === 'r15abs') return MANUAL_R15;
  if (!v.manualJson) return [];
  try {
    return JSON.parse(v.manualJson).map((x, i) => ({ id: 'm' + i, t: x.t, k: x.k || '', r: [].concat(x.r || []), p: x.p || '' }));
  } catch (e) { return []; }
}
function pareceR15() { const v = veic(); return !!v && /r\s?-?15/i.test([v.marca, v.modelo, v.apelido].join(' ')); }

/** Busca simples: pontua cada tópico pelas palavras da pergunta no título, nas palavras-chave e no texto. */
function buscarManual(q) {
  const toks = normal(q).split(/[^a-z0-9]+/).filter(t => t.length >= 3 && PALAVRAS_VAZIAS.indexOf(t) < 0);
  if (!toks.length) return [];
  return baseManual().map(tp => {
    const titulo = normal(tp.t), chaves = normal(tp.k), corpo = normal(tp.r.join(' '));
    let pts = 0;
    toks.forEach(t => {
      const raiz = t.length > 5 ? t.slice(0, t.length - 1) : t;
      if (titulo.indexOf(raiz) >= 0) pts += 4;
      if (chaves.indexOf(raiz) >= 0) pts += 3;
      if (corpo.indexOf(raiz) >= 0) pts += 1;
    });
    return { tp: tp, pts: pts };
  }).filter(x => x.pts > 0).sort((a, b) => b.pts - a.pts).slice(0, 4).map(x => x.tp);
}

function cardDoTopico(tp) {
  if (!tp.item) return null;
  const alvo = normal(tp.item);
  return resumo().cards.find(c => normal(c.item).indexOf(alvo) === 0) || null;
}

function situacaoTxt(c) {
  const p = [];
  if (c.kmRestante !== null && c.kmRestante !== undefined) p.push(c.kmRestante > 0 ? 'faltam ' + fKm(c.kmRestante) : c.kmRestante === 0 ? 'chegou no km' : 'passou ' + fKm(-c.kmRestante));
  if (c.dataPrevista) p.push((c.diasRestantes < 0 ? 'venceu em ' : 'prevista para ') + fData(c.dataPrevista));
  return p.join(', ');
}

function linkarTel(t) {

}

function textoParaClaude(pergunta, tp) {
  const v = veic(), r = resumo();
  const l = [];
  l.push('Tenho uma ' + [v.marca, v.modelo, v.ano].filter(Boolean).join(' ') + ' com ' + fNum(r.kmAtual, 0) + ' km' +
    (r.mediaDia ? ' (rodo cerca de ' + fNum(r.mediaDia) + ' km por dia)' : '') + '.');
  const cards = r.cards.filter(c => c.status === 'vencido' || c.status === 'atencao').slice(0, 5);
  if (cards.length) l.push('Manutenções vencendo no meu app: ' + cards.map(c => c.item + ' (' + situacaoTxt(c) + ')').join('; ') + '.');
  const servs = S.d.servicos.filter(s => s.veiculoId === v.id).sort((a, b) => String(b.data).localeCompare(String(a.data))).slice(0, 4);
  if (servs.length) l.push('Últimos serviços: ' + servs.map(s => s.item + ' em ' + fData(s.data) + (s.km !== null ? ' com ' + fNum(s.km, 0) + ' km' : '')).join('; ') + '.');
  if (tp) l.push('O manual diz sobre "' + tp.t + '": ' + tp.r.join(' ').slice(0, 700));
  l.push('Minha dúvida: ' + pergunta);
  l.push('Responda em português, de forma curta e prática.');
  return l.join('\n');
}

function copiarTexto(t) {
  try { if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(t).catch(() => copiarAntigo(t)); return; } } catch (e) { }
  copiarAntigo(t);
}
function copiarAntigo(t) {
  const a = document.createElement('textarea');
  a.value = t; a.style.position = 'fixed'; a.style.opacity = '0';
  document.body.appendChild(a); a.select();
  try { document.execCommand('copy'); } catch (e) { }
  a.remove();
}

function abrirClaude(pergunta, tp) {
  const texto = textoParaClaude(pergunta, tp);
  copiarTexto(texto);
  const url = 'https://claude.ai/new?q=' + encodeURIComponent(texto);
  const w = window.open(url, '_blank');
  if (!w) {
    S.linkClaude = url;
    render();
  }
  toast('Abrindo o Claude. Se a pergunta não aparecer pronta, é só colar: ela já está copiada.');
}

// ===================== COMUNICAÇÃO COM O SERVIDOR =====================
const VERSAO_APP = 9;
const MSG_VERSAO = 'O Code.gs publicado está desatualizado. Cole o Code.gs novo, salve (Ctrl+S) e faça Implantar > Gerenciar implantações > lápis > Nova versão.';
function run(fn, ...args) {
  return new Promise((ok, erro) => {
    if (typeof google.script.run[fn] !== 'function') { erro(new Error(MSG_VERSAO)); return; }
    google.script.run.withSuccessHandler(ok)
      .withFailureHandler(e => erro(e instanceof Error ? e : new Error(msgErro(e))))[fn](...args);
  });
}
let nCarregando = 0;
function carregando(txt) { nCarregando++; $('#carregandoTxt').textContent = txt || ''; $('#carregando').classList.remove('oculto'); }
function pronto() { nCarregando = Math.max(0, nCarregando - 1); if (!nCarregando) $('#carregando').classList.add('oculto'); }
let tToast;
function toast(m, erro) {
  const el = $('#toast');
  el.textContent = m;
  el.className = erro ? 'erro' : '';
  clearTimeout(tToast);
  tToast = setTimeout(() => { el.className = 'oculto'; }, erro ? 7000 : 2800);
}
/** Chama o servidor com tela de carregando. Se voltar dados novos, redesenha. */
async function acao(fn, args, txt, okTxt) {
  carregando(txt || 'Salvando...');
  try {
    const r = await run(fn, ...(args || []));
    if (r && r.veiculos) setDados(r);
    if (okTxt) toast(okTxt);
    return r;
  } catch (e) {
    toast(msgErro(e), true);
    e.mostrado = true;
    throw e;
  } finally {
    pronto();
  }
}
// ===================== PREFERÊNCIAS =====================
// Guardadas neste aparelho (para abrir rápido) e na sua conta (para valer no PC e no celular).
const PREFS = ['tema', 'cor_app', 'cor_abertura', 'som', 'somArq_esportivo', 'somArq_custom'];
const PREF_PEND = {};
let prefTimer = null;
function salvarPref(k, v) {
  gravarLocal(k, v || '');
  PREF_PEND[k] = v || '';
  clearTimeout(prefTimer);
  prefTimer = setTimeout(enviarPrefs, 500);
}
function enviarPrefs() {
  const lote = Object.assign({}, PREF_PEND);
  if (!Object.keys(lote).length || typeof google === 'undefined') return;
  Object.keys(lote).forEach(k => delete PREF_PEND[k]);
  google.script.run.withFailureHandler(() => { Object.keys(lote).forEach(k => { if (!(k in PREF_PEND)) PREF_PEND[k] = lote[k]; }); })
    .withSuccessHandler(() => { }).salvarPreferencias(lote);
}
/** Aplica o que está salvo na conta. Na primeira vez, sobe o que já estava neste aparelho. */
function aplicarPrefsConta(p) {
  if (!p) return;
  if (!p.iniciado) {
    PREFS.forEach(k => { const v = lerLocal(k); if (v) PREF_PEND[k] = v; });
    PREF_PEND.iniciado = '1';
    enviarPrefs();
    return;
  }
  let visual = false, som = false;
  PREFS.forEach(k => {
    if (k in PREF_PEND) return; // mudança local ainda indo para a conta
    const v = p[k] || '';
    if (lerLocal(k) !== v) {
      gravarLocal(k, v);
      if (/^somArq_/.test(k)) som = true; else visual = true;
    }
  });
  if (visual) aplicarTema(temaAtual(), true);
  if (som) AB.sons = carregarSons().catch(() => { });
}
function setDados(d) {
  S.d = d;
  if (d.preferencias) aplicarPrefsConta(d.preferencias);
  if (d.versao !== VERSAO_APP) setTimeout(() => toast(MSG_VERSAO + ' (Code.gs: versão ' + (d.versao || 1) + ', tela: versão ' + VERSAO_APP + ')', true), 1500);
  if (!d.veiculos.some(v => v.id === S.vid)) S.vid = d.veiculos.length ? d.veiculos[0].id : '';
  gravarLocal('vid', S.vid);
  render();
}
function carregar() {
  const inicio = Date.now();
  run('getDados').then(d => {
    setTimeout(() => {
      AB.dados = d;
      tentarEntrar();
    }, Math.max(0, 900 - (Date.now() - inicio)));
  }).catch(e => {
    if (/SEM_SERVIDOR|SESSAO_EXPIRADA/.test(msgErro(e))) { telaLogin('entrar'); return; }
    AB.liberada = true;
    esconderAbertura();
    $('#tela').innerHTML = '<div class="card"><h3>Não consegui abrir</h3><p class="sub">' + esc(msgErro(e)) +
      '</p><button class="btn pri" data-acao="recarregar">Tentar de novo</button></div>';
  });
}

function cardHtml(c) {
  let numRev = '';
  if (c.categoria === 'revisao') {
    const base = (veic() && veic().kmInicial) || 0;
    if (base < (c.primeiraKm || c.intervaloKm || 1e9)) numRev = (c.feitas + 1) + 'ª revisão · ';
  }
  const r = resumo();
  const rotulo = { vencido: 'Vencida', atencao: 'Atenção', ok: 'Em dia', sem: 'Sem intervalo' }[c.status];
  const partes = [];
  if (c.kmRestante !== null && c.kmRestante !== undefined) {
    partes.push('Próxima aos ' + fKm(c.proximoKm) + ' (' + (c.kmRestante > 0 ? 'faltam ' + fKm(c.kmRestante) : c.kmRestante === 0 ? 'é agora' : 'passou ' + fKm(-c.kmRestante)) + ')');
  }
  if (c.dataPrevista) partes.push((c.diasRestantes < 0 ? 'venceu em ' : 'prevista para ') + fData(c.dataPrevista) + (c.diasRestantes >= 0 ? ' (' + rel(c.dataPrevista) + ')' : ''));
  else if (c.kmRestante > 0 && !r.mediaDia) partes.push('lance o km por alguns dias para prever a data');
  let destaque = numRev + partes.join(' · ');
  destaque = destaque.charAt(0).toUpperCase() + destaque.slice(1);
  let ult;
  if (c.primeira) ult = '1ª vez: aos ' + fKm(c.primeiraKm) + (c.primeiraMeses ? ' ou ' + fMeses(c.primeiraMeses) : '') + ' (fim do amaciamento)';
  else if (c.semRegistro) ult = 'Contando desde o cadastro' + (veic() && veic().kmInicial ? ' (' + fKm(veic().kmInicial) + ')' : '');
  else ult = 'Última: ' + [c.ultimaKm !== null && c.ultimaKm !== undefined ? fKm(c.ultimaKm) : '', c.ultimaData ? 'em ' + fData(c.ultimaData) : ''].filter(Boolean).join(' ');
  const usado = c.fracao === null || c.fracao === undefined ? 0 : (1 - Math.max(0, Math.min(1, c.fracao))) * 100;
  return '<div class="card mcard ' + c.status + '">' +
    '<div class="cat-tag cat-' + c.categoria + '">' + (NOME_CAT[c.categoria] || '') + '</div>' +
    '<div class="mtopo"><div class="mnome">' + esc(c.item) + '</div><span class="selo ' + c.status + '">' + rotulo + '</span></div>' +
    (destaque ? '<div class="destaque">' + esc(destaque) + '</div>' : '') +
    '<div class="barra"><i style="width:' + usado.toFixed(0) + '%"></i></div>' +
    '<div class="sub">' + (c.primeira ? 'Depois, ' : '') + esc(intervalo(c)) + (c.garantia ? ' · conta para a garantia' : '') + '</div>' +
    '<div class="sub">' + esc(ult) + '</div>' +

function telaRotina() {
  const r = resumo();
  const cards = r.cards.filter(c => c.categoria === 'rotina');
  const nomes = cards.map(c => normal(c.item));
  const sugest = ROTINAS_SUGERIDAS.filter(s => nomes.indexOf(normal(s[0])) < 0);
  let h = '<div class="card sub">Coisas que você faz sempre, a cada tantos km ou tantos dias. Ao tocar em Feito, a próxima já aparece com o km certo.</div>';
  h += '<div class="linha-btns"><button class="btn pri" data-acao="novoItem" data-cat="rotina">+ Rotina</button></div>';
  h += cards.map(cardHtml).join('');
  if (sugest.length) {
    h += '<div class="rot" style="margin:14px 2px 8px">Sugestões com um toque</div><div class="chips quebra">' +
      sugest.map((s, i) => '<button class="chip" data-acao="rotinaRapida" data-i="' + ROTINAS_SUGERIDAS.indexOf(s) + '">+ ' + esc(s[0]) + ' · ' +
        esc([s[1] ? 'a cada ' + fKm(s[1]) : '', s[2] ? fMeses(s[2]) : ''].filter(Boolean).join(' ou ')) + '</button>').join('') + '</div>';
  }
  return h;
}

function telaTodas() {
  const v = veic(), r = resumo();
  const servs = S.d.servicos.filter(s => s.veiculoId === v.id).sort((a, b) => String(b.data).localeCompare(String(a.data)));
  const kms = S.d.km.filter(k => k.veiculoId === v.id).sort((a, b) => String(b.data).localeCompare(String(a.data)) || b.km - a.km).slice(0, 30);
  let h = '';
  ['periodica', 'revisao', 'rotina'].forEach(cat => {
    const cs = r.cards.filter(c => c.categoria === cat);
    h += '<h2>' + { periodica: 'Manutenções periódicas', revisao: 'Revisões', rotina: 'Rotina' }[cat] + ' <span class="sub">(' + cs.length + ')</span></h2>';
    h += '<div class="card lista">' + (cs.length ? cs.map(c => '<div class="it"><span class="ponto ' + (c.status === 'ok' ? 'ok' : c.status) + '"></span><div class="c"><div class="t">' + esc(c.item) + '</div><div class="sub">' +
      esc(intervalo(c)) + (c.proximoKm ? ' · próxima aos ' + fKm(c.proximoKm) : c.dataPrevista ? ' · próxima em ' + fData(c.dataPrevista) : '') + '</div></div>' +
      '<div class="mini-acoes"><button class="btn peq" data-acao="editarItem" data-id="' + c.id + '">Editar</button>' +
      '<button class="btn peq perigo" data-acao="excluir" data-tab="Plano" data-id="' + c.id + '" data-msg="Excluir &quot;' + esc(c.item) + '&quot; do plano?">Excluir</button></div></div>').join('')
      : '<div class="sub">Nenhum item.</div>') + '</div>';
  });
  if (r.cards.length) h += '<button class="btn perigo grande" data-acao="apagarPlano">Apagar o plano inteiro</button>';
  h += '<h2>Histórico de serviços</h2><div class="linha-btns"><button class="btn" data-acao="servicoAvulso">+ Serviço avulso</button></div><div class="card lista">' +
    (servs.length ? servs.map(s => '<div class="it"><div class="c"><div class="t">' + esc(s.item) + '</div><div class="sub">' + fData(s.data) +
      (s.km !== null ? ' · ' + fKm(s.km) : '') + (s.oficina ? ' · ' + esc(s.oficina) : '') + (s.valor ? ' · ' + fR(s.valor) : '') + '</div>' +
      (s.obs ? '<div class="sub">' + esc(s.obs) + '</div>' : '') +
      (s.fotoId ? '<a href="' + linkArq(s.fotoId) + '" target="_blank">Ver nota</a>' : '') + '</div>' +
      '<div class="mini-acoes"><button class="btn peq" data-acao="editarServico" data-id="' + s.id + '">Editar</button>' +
      '<button class="btn peq perigo" data-acao="excluir" data-tab="Servicos" data-id="' + s.id + '" data-msg="Excluir este serviço do histórico?">Excluir</button></div></div>').join('')
      : '<div class="sub">Nenhum serviço registrado ainda.</div>') + '</div>';
  h += '<h2>Leituras de km</h2><div class="card lista">' +
    (kms.length ? kms.map(k => '<div class="it"><div class="c"><div class="t">' + fKm(k.km) + '</div><div class="sub">' + fData(k.data) +
      (k.obs ? ' · ' + esc(k.obs) : '') + '</div></div><button class="btn peq perigo" data-acao="excluir" data-tab="Km" data-id="' + k.id +
      '" data-msg="Apagar a leitura de ' + fKm(k.km) + '?">Excluir</button></div>').join('')
      : '<div class="sub">Nenhuma leitura ainda. Use "Lançar km" na tela inicial.</div>') + '</div>';
  return h;

function telaDocs() {
  const seg = [['documentos', 'Documentos'], ['multas', 'Multas'], ['lembretes', 'Lembretes']];
  let h = '<div class="seg">' + seg.map(s => '<button data-acao="subDocs" data-k="' + s[0] + '" class="' + (S.subDocs === s[0] ? 'ativa' : '') + '">' + s[1] + '</button>').join('') + '</div>';
  if (S.subDocs === 'multas') h += telaMultas();
  else if (S.subDocs === 'lembretes') h += telaLembretes();
  else h += telaDocumentos();
  return h;
}

function seloVenc(iso) {
  const d = diasAte(iso);
  if (d === null) return '';
  const n = d < 0 ? 'vencido' : d <= 7 ? 'atencao' : d <= 30 ? 'info' : 'ok';
  return '<span class="selo ' + n + '">' + (d < 0 ? 'Venceu ' : 'Vence ') + rel(iso) + '</span>';
}

const SLOTS = [['Manual', 'Manual do proprietário'], ['CRLV', 'CRLV-e'], ['Seguro', 'Apólice do seguro'], ['Boleto', 'Boletos do seguro'], ['CNH', 'CNH']];

function arquivoDoSlot(k) {
  const v = veic();
  if (k === 'Manual') return v && v.manualId ? String(v.manualId).split(',')[0] : '';
  const d = S.d.documentos.find(x => x.tipo === k && x.arquivoId && (x.veiculoId === S.vid || (k === 'CNH' && !x.veiculoId)));
  return d ? d.arquivoId : '';
}

/** Lista fixa dos PDFs da moto: anexar uma vez, abrir com um toque. */
function arquivosHtml() {
  if (!S.d.veiculos.length) return '';
  return '<div class="card arquivos"><h3>Arquivos da moto</h3><div class="sub" style="margin-bottom:6px">Anexe os PDFs uma vez. Depois é só tocar em Abrir.</div>' +
    SLOTS.map(s => {
      const id = arquivoDoSlot(s[0]);
      return '<div class="slot"><div class="slot-nome">' + icone('docs', 18) + '<span>' + s[1] + '</span></div><div class="slot-acoes">' +
        (id ? '<a class="btn pri peq" href="' + linkArq(id) + '" target="_blank">Abrir</a>' : '') +
        '<label class="btn peq">' + (id ? 'Trocar' : 'Anexar') + '<input type="file" accept="application/pdf,image/*" data-slot="' + s[0] + '" hidden></label></div></div>';
    }).join('') + '</div>';
}

async function anexarSlot(input) {
  const f = input.files && input.files[0];
  if (!f) return;
  const k = input.dataset.slot;
  carregando('Enviando ' + (SLOTS.find(s => s[0] === k) || [k, k])[1] + '...');
  try {
    const id = await enviarArquivo(f, 1800);
    pronto();
    await acao('anexarArquivo', [S.vid, k, id], 'Guardando...', 'Arquivo anexado. Toque em Abrir para ver.');
  } catch (e) {
    pronto();
    if (!e.mostrado) toast(msgErro(e), true);
  }
}

function telaDocumentos() {
  const docs = S.d.documentos.slice().sort((a, b) => String(a.vencimento || '9999').localeCompare(String(b.vencimento || '9999')));
  let h = arquivosHtml() + '<div class="linha-btns"><button class="btn pri" data-acao="novoDoc">+ Documento</button></div>';
  if (!docs.length) return h + '<div class="card vazio"><p class="sub">Guarde aqui o CRLV, a CNH, a apólice do seguro, o IPVA e o licenciamento. O app avisa 30 e 7 dias antes de vencer.</p></div>';
  return h + docs.map(d => '<div class="card"><div class="mtopo"><div><div class="mnome">' + esc(d.tipo === 'Outro' && d.descricao ? d.descricao : (d.tipo || 'Documento')) + '</div><div class="sub">' +
    esc([d.tipo === 'Outro' ? '' : d.descricao, d.veiculoId ? nomeVeic(d.veiculoId) : ''].filter(Boolean).join(' · ')) + '</div></div>' + seloVenc(d.vencimento) + '</div>' +
    '<div class="sub" style="margin-top:6px">' + (d.vencimento ? 'Vencimento: ' + fData(d.vencimento) : 'Sem vencimento') + (d.valor ? ' · ' + fR(d.valor) : '') + '</div>' +
    (d.obs ? '<div class="sub obs">' + linkarTel(esc(d.obs)) + '</div>' : '') +
    '<div class="acoes">' + (d.arquivoId ? '<a class="btn peq" href="' + linkArq(d.arquivoId) + '" target="_blank">Abrir arquivo</a>' : '') +
    '<button class="btn peq" data-acao="editarDoc" data-id="' + d.id + '">Editar</button></div></div>').join('');
}

function telaMultas() {
  const ord = { 'a pagar': 0, recorrendo: 1, paga: 2 };
  const sit = m => m.situacao || 'a pagar';
  const ms = S.d.multas.slice().sort((a, b) => (ord[sit(a)] - ord[sit(b)]) || String(a.vencimento || '9999').localeCompare(String(b.vencimento || '9999')));
  const aPagar = ms.filter(m => sit(m) === 'a pagar').reduce((s, m) => s + (m.valor || 0), 0);
  let h = '<div class="linha-btns"><button class="btn pri" data-acao="novaMulta">+ Multa</button></div>';
  if (aPagar) h += '<div class="card"><div class="rot">Total a pagar (sem desconto)</div><div class="num-g">' + fR(aPagar) + '</div></div>';
  h += ms.map(m => {
    const s = sit(m);
    const nivel = s === 'paga' ? 'ok' : s === 'recorrendo' ? 'info' : (diasAte(m.vencimento) < 0 ? 'vencido' : 'atencao');
    const nome = { 'a pagar': 'A pagar', paga: 'Paga', recorrendo: 'Recorrendo' }[s] || s;
    let c = '<div class="card"><div class="mtopo"><div><div class="mnome">' + esc(m.descricao || 'Multa') + '</div><div class="sub">' +
      esc([m.orgao, m.dataInfracao ? 'infração em ' + fData(m.dataInfracao) : '', m.veiculoId ? nomeVeic(m.veiculoId) : ''].filter(Boolean).join(' · ')) +
      '</div></div><span class="selo ' + nivel + '">' + esc(nome) + '</span></div>';
    c += '<div class="grade2" style="margin-top:10px"><div><div class="rot">Valor</div><div class="num-m">' + fR(m.valor) + '</div></div>' +
      '<div><div class="rot">Vencimento</div><div class="num-m">' + (m.vencimento ? fData(m.vencimento) : '—') + '</div>' +
      (s === 'a pagar' && m.vencimento ? '<div class="sub">' + rel(m.vencimento) + '</div>' : '') + '</div>';
    if (s === 'a pagar' && m.valor) {
      c += '<div><div class="rot">Até o vencimento (−20%)</div><div class="num-m">' + fR(m.valor * 0.8) + '</div></div>' +
        '<div><div class="rot">SNE, sem recorrer (−40%)</div><div class="num-m">' + (m.sne ? fR(m.valor * 0.6) : '—') + '</div>' +
        (m.sne ? '' : '<div class="sub">marque SNE se tiver adesão</div>') + '</div>';
    }
    c += '</div><div class="acoes">' + (s === 'a pagar' ? '<button class="btn pri peq" data-acao="multaPaga" data-id="' + m.id + '">Marcar como paga</button>' : '') +
      (m.arquivoId ? '<a class="btn peq" href="' + linkArq(m.arquivoId) + '" target="_blank">Arquivo</a>' : '') +
      '<button class="btn peq" data-acao="editarMulta" data-id="' + m.id + '">Editar</button></div></div>';
    return c;
  }).join('');
  h += '<div class="card sub">20% de desconto: pagando até o vencimento. 40%: só com adesão ao SNE (Sistema de Notificação Eletrônica), ' +
    'reconhecendo a infração sem defesa nem recurso e pagando até o vencimento. O desconto não tira os pontos da CNH.</div>';
  return h;
}

  if (!ls.length) return h + '<div class="card vazio"><p class="sub">Crie lembretes como "renovar o seguro", "lavar a moto" ou "calibrar os pneus". Eles aparecem no início e no e-mail de avisos.</p></div>';
  return h + '<div class="card lista">' + ls.map(l => {

      (l.concluido ? ' (feito)' : '') + '</div><div class="sub">' + fData(l.data) + (l.data ? ' (' + rel(l.data) + ')' : '') + ' · ' + (rep[l.repetir || ''] || '') +

      '<div style="display:flex;flex-direction:column;gap:6px">' + (l.concluido ? '' : '<button class="btn pri peq" data-acao="concluirLembrete" data-id="' + l.id + '">Feito</button>') +
      '<button class="btn peq" data-acao="editarLembrete" data-id="' + l.id + '">Editar</button></div></div>';
  }).join('') + '</div>';

function telaGastos() {
  if (!S.d.veiculos.length) return semVeiculo();
  const v = veic(), r = resumo();
  const ano = S.ano || Number(S.d.hoje.slice(0, 4));
  const doV = x => x.veiculoId === v.id;
  const geralOuV = x => !x.veiculoId || x.veiculoId === v.id;
  const lanc = [];
  S.d.servicos.filter(doV).forEach(s => lanc.push({ cat: 'Manutenção', data: s.data, valor: s.valor }));
  S.d.abastecimentos.filter(doV).forEach(a => lanc.push({ cat: 'Combustível', data: a.data, valor: a.valor }));
  S.d.documentos.filter(geralOuV).forEach(d => lanc.push({ cat: 'Documentos e impostos', data: d.vencimento, valor: d.valor }));
  S.d.multas.filter(geralOuV).filter(m => m.situacao === 'paga').forEach(m => lanc.push({ cat: 'Multas', data: m.vencimento || m.dataInfracao, valor: m.valor }));
  const doAno = lanc.filter(l => l.valor && String(l.data || '').indexOf(ano + '-') === 0);
  const total = doAno.reduce((s, l) => s + l.valor, 0);
  const cats = ['Manutenção', 'Combustível', 'Documentos e impostos', 'Multas'].map(c => [c, doAno.filter(l => l.cat === c).reduce((s, l) => s + l.valor, 0)]);
  const meses = Array.from({ length: 12 }, (_, i) => doAno.filter(l => Number(l.data.slice(5, 7)) === i + 1).reduce((s, l) => s + l.valor, 0));
  const max = Math.max.apply(null, meses.concat([1]));
  const nomesM = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
  const abs = S.d.abastecimentos.filter(doV).sort((a, b) => String(b.data).localeCompare(String(a.data)) || b.km - a.km);
  const c = r.consumo || {};
  let h = '<div class="card"><div class="mtopo" style="align-items:center"><button class="btn peq" data-acao="ano" data-d="-1" aria-label="Ano anterior">‹</button>' +
    '<div style="text-align:center"><div class="rot">Gastos em ' + ano + ' · ' + esc(v.apelido) + '</div><div class="num-g">' + fR(total) + '</div></div>' +
    '<button class="btn peq" data-acao="ano" data-d="1" aria-label="Próximo ano">›</button></div>' +
    '<div class="grade2" style="margin-top:12px">' + cats.map(x => '<div><div class="rot">' + x[0] + '</div><div class="num-m">' + fR(x[1]) + '</div></div>').join('') + '</div>' +
    '<div class="barras" style="margin-top:14px">' + meses.map((m, i) => '<div class="b"><span class="m">' + nomesM[i] + '</span><div class="trilho"><i style="width:' +
      (m / max * 100).toFixed(1) + '%"></i></div><span class="v">' + (m ? fR(m) : '') + '</span></div>').join('') + '</div></div>';
  h += '<h2>Combustível</h2><div class="card grade2">' +
    '<div><div class="rot">Consumo médio</div><div class="num-m">' + (c.media ? fNum(c.media) + ' km/l' : '—') + '</div></div>' +
    '<div><div class="rot">Último tanque</div><div class="num-m">' + (c.ultimo ? fNum(c.ultimo) + ' km/l' : '—') + '</div></div>' +
    '<div><div class="rot">Custo de combustível por km</div><div class="num-m">' + (c.custoPorKm ? fR(c.custoPorKm) : '—') + '</div></div>' +
    '<div><div class="rot">Abastecimentos</div><div class="num-m">' + abs.length + '</div></div></div>';
  h += '<div class="linha-btns"><button class="btn pri" data-acao="novoAbast">+ Abastecimento</button></div><div class="card lista">' +
    (abs.length ? abs.map(a => '<div class="it"><div class="c"><div class="t">' + fData(a.data) + ' · ' + fNum(a.litros, 2) + ' L' + (a.valor ? ' · ' + fR(a.valor) : '') +
      '</div><div class="sub">' + fKm(a.km) + (a.tanqueCheio ? ' · tanque cheio' : '') + (c.porId && c.porId[a.id] ? ' · ' + fNum(c.porId[a.id]) + ' km/l' : '') +
      '</div></div><button class="btn peq" data-acao="editarAbast" data-id="' + a.id + '">Editar</button></div>').join('')
      : '<div class="sub">Para o app calcular o consumo, encha o tanque e marque "tanque cheio" em cada abastecimento.</div>') + '</div>';
  return h;
}

      '<button class="btn pri" data-acao="lerManual">' + icone('livro', 16) + ' Ler o manual com o Claude</button></div>' +

  }

  h += man ? '<a class="btn grande" style="margin-bottom:10px" href="' + linkArq(man) + '" target="_blank">' + icone('livro', 18) + ' Abrir o manual em PDF</a>'
    : '<label class="btn grande" style="margin-bottom:10px">' + icone('livro', 18) + ' Anexar o manual em PDF<input type="file" accept="application/pdf" data-slot="Manual" hidden></label>';

  h += '<div class="chips">' + rapidas.map(q => '<button class="chip" data-acao="chip" data-q="' + esc(q) + '">' + esc(q) + '</button>').join('') + '</div>';

function resultadosHtml() {
  let h = '';
  if (S.linkClaude) {
    h += '<div class="card"><p class="sub">O navegador bloqueou a janela. Toque no link para abrir o Claude (a pergunta já está copiada):</p>' +
      '<a class="btn pri" href="' + esc(S.linkClaude) + '" target="_blank">Abrir o Claude</a></div>';
  }
  const q = S.busca.trim();
  if (q) {
    const achados = buscarManual(q);
    if (achados.length) {
      h += '<div class="rot" style="margin:4px 2px 8px">O que o manual diz</div>' + achados.map((tp, i) => topicoHtml(tp, i === 0 || S.aberto === tp.id)).join('');
    } else {
      h += '<div class="card vazio"><p class="sub">Não achei isso no manual.</p></div>';
    }
    h += '<div class="card claude-card"><div><b>Não era isso?</b><div class="sub">Abre o Claude na sua conta, com a pergunta e os dados da moto prontos. Sem custo extra.</div></div>' +
      '<button class="btn pri" data-acao="claude">' + icone('claude', 16) + ' Perguntar ao Claude</button></div>';
    return h;
  }
  h += '<div class="rot" style="margin:4px 2px 8px">Todos os assuntos do manual</div>' + baseManual().map(tp => topicoHtml(tp, S.aberto === tp.id)).join('');
  h += '<div class="card claude-card"><div><b>Outra dúvida?</b><div class="sub">Abre o Claude na sua conta, com os dados da moto prontos.</div></div>' +
    '<button class="btn pri" data-acao="claude">' + icone('claude', 16) + ' Perguntar ao Claude</button></div>';
  return h;
}

function atualizarResultados() {
  const el = $('#resultados');
  if (el) el.innerHTML = resultadosHtml();
}

function telaMais() {
  const subs = { financiamento: telaFinanciamento, gastos: telaGastos, veiculos: telaVeiculos, aparencia: telaAparencia, checklist: telaChecklist,
    relatorio: telaRelatorio, config: telaConfig };
  if (subs[S.subMais]) return '<button class="btn peq" data-acao="subMais" data-k="" style="margin-bottom:12px">‹ Voltar</button>' + subs[S.subMais]();

// ===================== FINANCIAMENTO (CDC) =====================
function fMesAno(iso) { const m = String(iso || '').match(/^(\d{4})-(\d{2})/); return m ? m[2] + '/' + m[1] : ''; }

/** Valor de uma parcela pago hoje: no CDC, antecipar tira os juros dos dias que faltam (CDC, art. 52, § 2º). */
function valorHoje(p, f) {
  const dias = diasAte(p.vencimento);
  const i = (f.taxaMensal || 0) / 100;
  if (!i || dias === null || dias <= 0) return p.valor;
  return Math.round(p.valor / Math.pow(1 + i, dias / 30) * 100) / 100;
}

function resumoFin(f) {
  const ps = S.d.parcelas.filter(p => p.financiamentoId === f.id).sort((a, b) => a.numero - b.numero);
  const pagas = ps.filter(p => p.pago), abertas = ps.filter(p => !p.pago);
  return {
    ps: ps, pagas: pagas, abertas: abertas,
    proxima: abertas[0] || null, ultima: abertas[abertas.length - 1] || null,
    saldoNominal: abertas.reduce((s, p) => s + p.valor, 0),
    saldoHoje: abertas.reduce((s, p) => s + valorHoje(p, f), 0),
    economia: pagas.reduce((s, p) => s + Math.max(0, p.valor - (p.valorPago || p.valor)), 0),
    atrasadas: abertas.filter(p => diasAte(p.vencimento) < 0).length
  };
}

function finsDoVeiculo() { return S.d.financiamentos.filter(f => !f.veiculoId || f.veiculoId === S.vid); }

function cartaoFinInicio() {
  const fs = finsDoVeiculo();
  if (!fs.length) return '';
  return fs.map(f => {
    const r = resumoFin(f);
    if (!r.proxima) return '';
    return '<button class="card fin-mini" data-acao="irFinanciamento"><div class="mtopo"><b>' + icone('docs', 16) + ' ' + esc(f.credor) + '</b><span class="sub">' + r.pagas.length + ' de ' + r.ps.length + ' pagas</span></div>' +
      '<div class="barra"><i style="width:' + (r.pagas.length / r.ps.length * 100).toFixed(0) + '%;background:var(--ok)"></i></div>' +
      '<div class="sub">Próxima: parcela ' + r.proxima.numero + ' em ' + fData(r.proxima.vencimento) + ' (' + rel(r.proxima.vencimento) + ') · ' + fR(r.proxima.valor) + '</div></button>';
  }).join('');
}

function telaFinanciamento() {
  const fs = S.d.financiamentos;
  let h = '<div class="linha-btns"><button class="btn pri" data-acao="novoFin">+ Financiamento</button></div>';
  if (!fs.length) {
    return h + '<div class="card vazio"><p><b>Nenhum financiamento cadastrado.</b></p><p class="sub">Cadastre o financiamento da moto para controlar as parcelas pagas, ' +
      'receber aviso antes do vencimento e ver quanto economiza antecipando parcelas.</p></div>';
  }
  fs.forEach(f => {
    const r = resumoFin(f);
    const pct = r.ps.length ? r.pagas.length / r.ps.length * 100 : 0;
    h += '<div class="card"><div class="mtopo"><div><div class="mnome">' + esc(f.credor) + '</div><div class="sub">' + esc(nomeVeic(f.veiculoId) || 'Geral') +
      (f.taxaMensal ? ' · juros de ' + fNum(f.taxaMensal, 2) + '% ao mês' : '') + '</div></div>' +
      '<button class="btn peq" data-acao="editarFin" data-id="' + f.id + '">Editar</button></div>' +
      '<div class="fin-grande">' + r.pagas.length + ' <span>de ' + r.ps.length + ' parcelas pagas</span></div>' +
      '<div class="barra"><i style="width:' + pct.toFixed(0) + '%;background:var(--ok)"></i></div>' +
      '<div class="grade2" style="margin-top:10px">' +
      '<div><div class="rot">Próxima parcela</div><div class="num-m">' + (r.proxima ? fData(r.proxima.vencimento) : 'Quitado!') + '</div>' +
      (r.proxima ? '<div class="sub">nº ' + r.proxima.numero + ' · ' + fR(r.proxima.valor) + ' · ' + rel(r.proxima.vencimento) + '</div>' : '') + '</div>' +
      '<div><div class="rot">Quitação prevista</div><div class="num-m">' + (r.ultima ? fMesAno(r.ultima.vencimento) : '—') + '</div>' +
      (r.ultima ? '<div class="sub">última em aberto: nº ' + r.ultima.numero + '</div>' : '') + '</div>' +
      '<div><div class="rot">Para quitar hoje</div><div class="num-m">' + (f.taxaMensal ? fR(r.saldoHoje) : '—') + '</div>' +
      '<div class="sub">' + (f.taxaMensal ? 'sem os juros futuros' : 'informe a taxa ou o valor financiado') + '</div></div>' +
      '<div><div class="rot">Soma das parcelas em aberto</div><div class="num-m">' + fR(r.saldoNominal) + '</div>' +
      (r.economia ? '<div class="sub ok-txt">economizou ' + fR(r.economia) + ' antecipando</div>' : '') + '</div></div>' +
      (r.atrasadas ? '<div class="sua-moto vencido" style="margin-top:10px"><b>' + r.atrasadas + ' parcela(s) atrasada(s).</b> Pague logo para evitar multa e juros de atraso.</div>' : '') +
      '<div class="acoes">' + (r.proxima ? '<button class="btn pri peq" data-acao="pagarParcela" data-id="' + r.proxima.id + '">Pagar a próxima (nº ' + r.proxima.numero + ')</button>' : '') +
      (r.ultima && r.ultima !== r.proxima ? '<button class="btn peq" data-acao="pagarParcela" data-id="' + r.ultima.id + '">Antecipar a última (nº ' + r.ultima.numero + ')</button>' : '') +
      (f.arquivoId ? '<a class="btn peq" href="' + linkArq(f.arquivoId) + '" target="_blank">Contrato</a>' : '') + '</div></div>';
    h += '<div class="card lista parcelas">' + r.ps.map(p => {
      const d = diasAte(p.vencimento);
      let st, cls;
      if (p.pago) {
        const ant = p.dataPagamento && dia(p.dataPagamento) < dia(p.vencimento);
        st = 'Paga em ' + fData(p.dataPagamento) + (p.valorPago && p.valorPago !== p.valor ? ' · ' + fR(p.valorPago) : '') + (ant ? ' · antecipada' : '');
        cls = 'ok';
      } else if (d < 0) { st = 'Atrasada ' + rel(p.vencimento); cls = 'vencido'; }
      else { st = 'Vence ' + rel(p.vencimento) + (f.taxaMensal && d > 0 ? ' · hoje sai por ' + fR(valorHoje(p, f)) : ''); cls = d <= 5 ? 'atencao' : 'info'; }
      return '<div class="it' + (p.pago ? ' paga' : '') + '"><span class="ponto ' + cls + '"></span><div class="c"><div class="t">Parcela ' + p.numero + ' · ' + fData(p.vencimento) + ' · ' + fR(p.valor) + '</div>' +
        '<div class="sub">' + st + '</div></div>' +
        (p.pago ? '<button class="btn peq" data-acao="desfazerParcela" data-id="' + p.id + '">Desfazer</button>'
          : '<button class="btn peq" data-acao="pagarParcela" data-id="' + p.id + '">Pagar</button>') + '</div>';
    }).join('') + '</div>';
  });
  h += '<div class="card sub">No financiamento CDC você pode pagar parcelas antes do vencimento, e o banco tem que tirar os juros proporcionais ' +
    '(Código de Defesa do Consumidor, art. 52, § 2º). Pagando as últimas parcelas, de trás para frente, o financiamento termina antes. ' +
    'Os valores com desconto aqui são uma estimativa: peça ao banco o boleto de antecipação com o valor exato.</div>';
  return h;
}

function formPagarParcela(p) {
  const f = S.d.financiamentos.find(x => x.id === p.financiamentoId);
  const d = diasAte(p.vencimento);
  const hojeVale = valorHoje(p, f);
  const antecipada = d > 0;
  abrirForm({
    titulo: 'Pagar a parcela ' + p.numero + ' de ' + f.nParcelas,
    intro: antecipada
      ? (f.taxaMensal
        ? 'Vence em ' + fData(p.vencimento) + '. Pagando hoje, com ' + d + ' dias de antecedência, sai por cerca de ' + fR(hojeVale) +
          ' (desconto de ' + fR(p.valor - hojeVale) + ' dos juros). Confira o valor exato no boleto de antecipação do banco.'
        : 'Vence em ' + fData(p.vencimento) + '. Sem a taxa de juros, o app não calcula o desconto. Informe a taxa em Editar.')
      : 'Vencimento: ' + fData(p.vencimento) + '.',
    salvarTxt: 'Marcar como paga',
    campos: [
      { n: 'data', t: 'Data do pagamento', tipo: 'date', req: true },
      { n: 'valor', t: 'Valor pago (R$)', tipo: 'number', req: true }
    ],
    valores: { data: S.d.hoje, valor: antecipada ? hojeVale : p.valor },
    aoSalvar: async o => {
      await acao('pagarParcela', [p.id, o.data, o.valor], 'Salvando...');
      const r = resumoFin(f);
      toast('Parcela ' + p.numero + ' paga.' + (r.ultima ? ' Quitação prevista: ' + fMesAno(r.ultima.vencimento) + '.' : ' Financiamento quitado!'));
    }
  });
}

const SOM_PADRAO = { esportivo: { nome: 'Kawasaki Z800' }, custom: { nome: 'Harley-Davidson' } };

function bancoSom() {

        } catch (e) { dados = null; }

      const ms = tocarArquivo(ac, SONS_BUF[tema]);

      ULTIMO_SOM.g.gain.cancelScheduledValues(t); ULTIMO_SOM.g.gain.setValueAtTime(ULTIMO_SOM.g.gain.value, t);
      ULTIMO_SOM.g.gain.linearRampToValueAtTime(0.0001, t + 0.25); ULTIMO_SOM.src.stop(t + 0.3);
    }
  } catch (e) { }
}
/** Toque na tela durante o ronco: pula direto para o app. */
function pularPartida() {

  pararSom();
  const fim = AB.fimPartida; AB.fimPartida = null; fim();
}
async function darPartida() {

  const sp = $('#abertura');
  $('#partida').classList.add('oculto');

function entrarSemSom() {

  $('#abertura').classList.remove('esperando');

}
/** Abre o app quando os dados chegaram e o som da partida terminou. */
function tentarEntrar() {

/** "Ouvir" nas configurações: mostra o velocímetro tocando o som do estilo em uso. */
function previaPartida(tema) {
  const sp = $('#abertura');
  sp.classList.remove('oculto', 'saindo', 'esperando', 'desligada');
  $('.abertura-sub').textContent = 'ouvindo o ronco...';

/** Sair: "desliga a moto", cobre a tela e para o som. Um site não consegue fechar a própria aba, então avisamos. */

  try { if (AC) AC.suspend(); } catch (e) { }

function lerRespostaClaude() {
  const txt = ($('#respostaClaude') || {}).value || '';
  const i = txt.indexOf('{'), j = txt.lastIndexOf('}');
  let json;
  try { json = JSON.parse(txt.slice(i, j + 1)); } catch (e) {
    toast('Não consegui ler a resposta. Copie o bloco de código inteiro que o Claude mandou e cole de novo.', true);
    return;
  }
  const num = x => { const n = numero(x); return n > 0 ? n : null; };
  const itens = (json.itens || []).map(x => ({
    item: String(x.item || '').trim(),
    categoria: ['periodica', 'revisao', 'rotina'].indexOf(x.categoria) >= 0 ? x.categoria : '',
    primeiraKm: num(x.primeiraKm), primeiraMeses: num(x.primeiraMeses),
    intervaloKm: num(x.km !== undefined ? x.km : x.intervaloKm),
    intervaloMeses: num(x.meses !== undefined ? x.meses : x.intervaloMeses),
    obs: [x.obs, x.pagina ? 'Manual p. ' + x.pagina : ''].filter(Boolean).join(' · ')
  })).filter(x => x.item);
  const topicos = (json.topicos || []).filter(x => x && x.t && x.r).map(x => ({ t: String(x.t), k: normal(x.k || ''), r: [].concat(x.r).map(String), p: String(x.p || '') }));
  if (!itens.length) { toast('A resposta não tem itens de manutenção. Peça ao Claude para seguir o formato e tente de novo.', true); return; }
  revisarPlanoManual(itens, json.ficha || {}, topicos);
}

function campoHtml(c, v) {

  switch (c.tipo) {
    case 'check':
      return '<label class="chk"><input type="checkbox" name="' + c.n + '"' + (val ? ' checked' : '') + '> ' + esc(c.t) + '</label>' + aj;
    case 'select':
      return '<label class="campo">' + rot + '<select name="' + c.n + '">' + c.opcoes.map(o => '<option value="' + esc(o.v) + '"' +
        (String(o.v) === String(val) ? ' selected' : '') + '>' + esc(o.t) + '</option>').join('') + '</select></label>' + aj;
    case 'textarea':
      return '<label class="campo">' + rot + '<textarea name="' + c.n + '"' + ph + '>' + esc(val) + '</textarea></label>' + aj;
    case 'foto': case 'arquivo': case 'arquivos':
      return '<label class="campo">' + rot + '<input type="file" name="' + c.n + '" accept="' + (c.tipo === 'foto' ? 'image/*' : esc(c.accept || '*/*')) + '"' +
        (c.tipo === 'arquivos' ? ' multiple' : '') + '></label>' +
        (val && c.tipo !== 'arquivos' ? '<div class="ajuda">Já tem arquivo: <a href="' + linkArq(val) + '" target="_blank">abrir</a>. Escolha outro só se quiser trocar.</div>' : '') + aj;
    case 'number':
      return '<label class="campo">' + rot + '<input type="text" name="' + c.n + '" inputmode="' + (c.im || 'decimal') + '" value="' +
        esc(val === '' ? '' : String(val).replace('.', ',')) + '"' + ph + auto + '></label>' + aj;
    case 'senha':
      return '<label class="campo">' + rot + '<input type="password" name="' + c.n + '" inputmode="numeric" maxlength="6" autocomplete="off"></label>' + aj;
    case 'date':

    default:

async function lerForm(form, cfg) {
  const o = {};
  const arquivos = [];
  for (const c of cfg.campos) {
    const el = form.querySelector('[name="' + c.n + '"]');
    if (c.tipo === 'check') { o[c.n] = el.checked; continue; }
    if (c.tipo === 'foto' || c.tipo === 'arquivo' || c.tipo === 'arquivos') {
      const files = Array.from(el.files || []);
      if (!files.length && c.req) throw new Error('Escolha o arquivo: ' + c.t);
      if (files.length) arquivos.push([c, files]);
      else if (c.tipo !== 'arquivos') o[c.n] = (cfg.valores || {})[c.n] || '';
      continue;
    }
    const bruto = el.value.trim();
    if (c.req && !bruto) throw new Error('Preencha: ' + c.t);
    if (c.tipo === 'number') {
      const n = numero(bruto);
      if (Number.isNaN(n)) throw new Error('Número inválido em: ' + c.t);
      o[c.n] = n;
    } else o[c.n] = bruto;
  }
  for (const [c, files] of arquivos) {
    carregando(files.length > 1 ? 'Enviando ' + files.length + ' arquivos...' : 'Enviando arquivo...');
    try {
      const ids = [];
      for (const f of files) ids.push(await enviarArquivo(f, c.tipo === 'arquivos' ? 2000 : c.tipo === 'foto' ? 1280 : 1800));
      o[c.n] = c.tipo === 'arquivos' ? ids : ids[0];
    } finally { pronto(); }
  }
  return o;
}

function comprimirImagem(file, max) {
  return new Promise((ok, erro) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.width * k);
      cv.height = Math.round(img.height * k);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url);
      ok(cv.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = () => { URL.revokeObjectURL(url); erro(new Error('Não consegui ler a imagem ' + file.name)); };
    img.src = url;
  });
}
function lerBase64(file) {
  return new Promise((ok, erro) => {
    const r = new FileReader();
    r.onload = () => ok(r.result);
    r.onerror = () => erro(new Error('Não consegui ler o arquivo ' + file.name));
    r.readAsDataURL(file);
  });
}
async function enviarArquivo(file, max) {
  let tipo = file.type || 'application/octet-stream', nome = file.name || 'arquivo', dataUrl;
  if (/^image\//.test(tipo) && !/gif/.test(tipo)) {
    dataUrl = await comprimirImagem(file, max);
    tipo = 'image/jpeg';
    nome = nome.replace(/\.\w+$/, '') + '.jpg';
  } else dataUrl = await lerBase64(file);
  return run('salvarArquivo', { nome: nome, tipo: tipo, base64: dataUrl.split(',')[1] });
}

function formItem(p, cat) {
  cat = (p && p.categoria) || cat || 'periodica';
  const r = resumo();
  let tempo = '', unidade = 'meses';
  if (p && p.intervaloMeses) {
    if (p.intervaloMeses < 1) { tempo = Math.round(p.intervaloMeses * 30); unidade = 'dias'; } else tempo = p.intervaloMeses;
  }
  const titulos = { periodica: 'manutenção periódica', revisao: 'revisão', rotina: 'rotina' };
  const campos = [
    { n: 'item', t: cat === 'rotina' ? 'O que fazer' : cat === 'revisao' ? 'Nome da revisão' : 'Manutenção', req: true,
      ph: cat === 'rotina' ? 'Ex.: Lubrificar a corrente' : cat === 'revisao' ? 'Ex.: Revisão periódica' : 'Ex.: Troca de óleo' },
    { n: 'categoria', t: 'Tipo', tipo: 'select', opcoes: [{ v: 'periodica', t: 'Manutenção periódica' }, { v: 'revisao', t: 'Revisão (concessionária)' }, { v: 'rotina', t: 'Rotina' }] },
    { n: 'intervaloKm', t: 'A cada quantos km', tipo: 'number', im: 'numeric' },
    { n: 'tempo', t: 'Ou a cada', tipo: 'number', im: 'numeric' },
    { n: 'unidade', t: 'Unidade do tempo', tipo: 'select', opcoes: [{ v: 'dias', t: 'dias' }, { v: 'semanas', t: 'semanas' }, { v: 'meses', t: 'meses' }] },
    { n: 'ultimaKm', t: 'Km da última vez que foi feito', tipo: 'number', im: 'numeric', ajuda: p ? '' : 'Em branco: começa a contar do km de hoje.' },
    { n: 'ultimaData', t: 'Data da última vez', tipo: 'date' },
    { n: 'garantia', t: 'Obrigatório para manter a garantia', tipo: 'check' },
    { n: 'obs', t: 'Observação', tipo: 'textarea' }
  ];
  abrirForm({
    titulo: p ? 'Editar ' + titulos[cat] : 'Nova ' + titulos[cat],
    intro: !p && cat === 'rotina' ? 'Quando você tocar em Feito, a próxima já aparece contando a partir dali.' : '',
    campos: campos,
    valores: p ? Object.assign({}, p, { tempo: tempo, unidade: unidade, categoria: cat }) : { categoria: cat, unidade: cat === 'rotina' ? 'dias' : 'meses', ultimaData: S.d.hoje },
    aoSalvar: async o => {
      const meses = o.tempo ? (o.unidade === 'dias' ? o.tempo / 30 : o.unidade === 'semanas' ? o.tempo * 7 / 30 : o.tempo) : null;
      if (!o.intervaloKm && !meses) throw new Error('Informe a cada quantos km, a cada quanto tempo, ou os dois.');
      const reg = Object.assign({ veiculoId: S.vid }, p || {}, {
        item: o.item, categoria: o.categoria, intervaloKm: o.intervaloKm, intervaloMeses: meses ? Math.round(meses * 10000) / 10000 : null,
        ultimaKm: o.ultimaKm !== null ? o.ultimaKm : (p ? p.ultimaKm : r.kmAtual), ultimaData: o.ultimaData || (p ? p.ultimaData : S.d.hoje),
        garantia: o.garantia, obs: o.obs
      });
      delete reg.tempo; delete reg.unidade;
      await acao('salvar', ['Plano', reg], 'Salvando...', 'Salvo');
      S.subMan = o.categoria;
      render();
    },
    aoExcluir: p ? async () => {
      if (!await confirmar('Excluir "' + p.item + '" do plano?')) return false;

  });

  desativarAvisos: () => acao('desativarAvisos', [], 'Desativando...', 'Avisos desativados').catch(ignorar),
  testarAvisos: async () => { try { toast(await acao('testarAvisos', [], 'Enviando e-mail de teste...')); } catch (e) { } },
  verIntro: () => mostrarIntro(),
  introProx: () => { S.slide = Math.min(SLIDES.length - 1, S.slide + 1); desenharIntro(); },
  introFim: () => fecharIntro(),
  introOutro: () => { fecharIntro(); formVeiculo(null); },
  fecharFolha: () => fecharFolha(),
  excluirForm: async () => {
    const cfg = FORM;
    if (!cfg || !cfg.aoExcluir) return;
    try { if (await cfg.aoExcluir()) fecharFolha(); } catch (e) { if (!e.mostrado) toast(msgErro(e), true); }
  },
  excluir: async d => {
    if (await confirmar(d.msg || 'Excluir este registro?')) acao('excluir', [d.tab, d.id], 'Excluindo...', 'Excluído').catch(ignorar);
  }
};

document.addEventListener('input', ev => {
  if (ev.target.id === 'busca') { S.busca = ev.target.value; S.aberto = ''; S.linkClaude = ''; atualizarResultados(); }
});
let toqueX = null;
document.addEventListener('touchstart', ev => { if (ev.target.closest('#intro')) toqueX = ev.touches[0].clientX; }, { passive: true });
document.addEventListener('touchend', ev => {
  if (toqueX === null) return;
  const dx = ev.changedTouches[0].clientX - toqueX;
  toqueX = null;
  if (Math.abs(dx) < 50) return;
  S.slide = Math.max(0, Math.min(SLIDES.length - 1, S.slide + (dx < 0 ? 1 : -1)));
  desenharIntro();
});

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-acao]');
  if (!el) {
    if (ev.target.id === 'camadaFolha') fecharFolha();
    return;
  }
  const fn = ACOES[el.dataset.acao];
  if (fn) { ev.preventDefault(); fn(el.dataset, el); }
});
document.addEventListener('click', ev => {
  const a = ev.target.closest && ev.target.closest('a[href^="#arq-"]');
  if (a) { ev.preventDefault(); ev.stopPropagation(); abrirArqServidor(decodeURIComponent(a.getAttribute('href').slice(5))); }
}, true);
document.addEventListener('input', ev => {
  if (ev.target.dataset && ev.target.dataset.cpf !== undefined) ev.target.value = mascaraCpf(ev.target.value);
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Enter' && ev.target.closest && ev.target.closest('#conectar')) { const b = $('#conectar .btn.pri'); if (b) b.click(); }
});
document.addEventListener('pointerdown', ev => {
  if (AB.fimPartida && ev.target.closest('#abertura.tocando')) { ev.preventDefault(); pularPartida(); }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.id === 'selVeiculo') { S.vid = t.value; gravarLocal('vid', S.vid); S.chat = []; S.relatorioUrl = ''; render(); }
  else if (t.id === 'usarManual') S.usarManual = t.checked;
  else if (t.id === 'somPartida') { salvarPref('som', t.checked ? 'sim' : 'nao'); toast(t.checked ? 'Som da partida ligado' : 'Som da partida desligado'); }
  else if (t.dataset && t.dataset.som) escolherSom(t);
  else if (t.dataset && t.dataset.cor) { salvarPref('cor_' + t.dataset.cor, t.value.toLowerCase()); aplicarCoresSalvas(); render(); }
  else if (t.dataset && t.dataset.slot) anexarSlot(t);
  else if (t.dataset && t.dataset.check !== undefined) { S.check[t.dataset.check] = t.checked; gravarLocal('check', JSON.stringify(S.check)); render(); }
});

try { S.check = JSON.parse(lerLocal('check') || '{}'); } catch (e) { S.check = {}; }
iniciarAbertura();
carregar();
</script>
</body>
</html>
